name: Decision needed
description: A choice that should not be made unilaterally by a person or an agent
labels: ["decision"]
body:
  - type: textarea
    id: question
    attributes:
      label: What has to be decided
    validations: { required: true }
  - type: textarea
    id: options
    attributes:
      label: Options considered, with the trade-off of each
    validations: { required: true }
  - type: input
    id: blocks
    attributes:
      label: What is blocked until this is decided
  - type: input
    id: by
    attributes:
      label: Decide by (date)
