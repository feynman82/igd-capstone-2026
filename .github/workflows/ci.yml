name: CI
on:
  pull_request:
  push: { branches: [main] }

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_PASSWORD: parrot, POSTGRES_DB: parrot_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:parrot@localhost:5432/parrot_test
      PARROT_LLM: fake            # no model in CI; core code takes a fake client
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --all-extras
      - run: psql "$DATABASE_URL" -f db/migrations/0001_init.sql
      - run: psql "$DATABASE_URL" -f db/migrations/0002_household.sql
      - run: psql "$DATABASE_URL" -f db/migrations/0003_advice.sql
      - run: psql "$DATABASE_URL" -f db/migrations/0004_calendar.sql
      - run: psql "$DATABASE_URL" -f db/migrations/0005_conversations.sql
      # Fails if a pack.yaml was edited without regenerating. This is what stops Zee's field
      # names and Desmond's register columns drifting apart.
      - run: uv run python -m packs.build --check
      # Fails if docs/team-tasks.csv was edited without regenerating the per-member lists.
      - run: uv run python scripts/build_team_tasks.py --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy core modules corpus
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run lint && npm run build
        working-directory: web
