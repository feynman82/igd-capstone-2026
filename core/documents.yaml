# The household's documents — core catalogue (ADR 0017)
#
# This file is the SINGLE SOURCE OF TRUTH for every document type, its fields, the reminders
# and alerts they register, and the core answering layer. After editing, run:
#     python -m packs.build
# which regenerates core/document_schemas.py, corpus/register/core_columns.csv, the batch
# template and docs/field-dictionary.md. Never edit a generated file by hand.
#
# Every ingested document and extracted fact belongs to the core, whichever packs are installed
# or enabled. A pack adds grounding, a persona, its own answering and advice, and names the
# fields declared here.

document_types:

  policy_schedule:
    description: Policy schedule or certificate of insurance setting out cover and premium
    subject_field: insured
    fields:
      - name: insurer
        type: string
        description: Name of the insurance company as printed on the schedule letterhead
        example: Meridian Assurance
      - name: policy_no
        type: identifier
        description: Policy number exactly as printed, not normalised
        example: MV-2026-448120
      - name: insured
        type: person
        description: Name of the policyholder as printed against Name of Insured
        example: Marcus Fernandez
      - name: product_name
        type: string
        description: Product name as printed at the head of the schedule, not a category
        example: Private Car Insurance Policy
      - name: cover_from
        type: date
        description: First day of the period of insurance, the from date on that line
        example: "2026-03-01"
      - name: expiry_date
        type: date
        required: false
        description: Last day of the period of insurance, the date after To on the Period of Insurance line; not a maturity date
        example: "2027-02-28"
      - name: maturity_date
        type: date
        required: false
        description: Date a life policy matures, only where the schedule prints the words Maturity Date; never a Period of Insurance To date
        example: "2087-05-07"
      - name: premium_payable
        type: money
        description: Total premium payable for the period of insurance shown, in SGD
        example: "742.00"
      - name: sum_insured
        type: money
        required: false
        description: Sum insured or limit of liability where the schedule prints one, in SGD
        example: "250000.00"
      - name: excess
        type: money
        required: false
        description: Amount the policyholder bears per claim, printed as Excess, in SGD
        example: "750.00"
      - name: date_of_birth
        type: date
        required: false
        description: Date of birth of the insured where the schedule prints one
        example: "1958-10-12"
      - name: riders
        type: labelled_money
        repeats: true
        required: false
        description: Each rider printed on the schedule, its name as the label and its own sum assured as the amount, in SGD
        example: "Critical Illness Rider=150000.00;Early Critical Illness Rider=50000.00"

  renewal_notice:
    description: Notice issued before expiry inviting the policyholder to renew
    subject_field: insured
    fields:
      - name: insurer
        type: string
        description: Name of the insurance company issuing the notice, from the letterhead
        example: Meridian Assurance
      - name: policy_no
        type: identifier
        description: Policy number exactly as printed, not normalised
        example: MV-2026-448120
      - name: insured
        type: person
        description: Name of the policyholder the notice is addressed to
        example: Marcus Fernandez
      - name: expiry_date
        type: date
        description: Date the current cover ends, as printed in the expiry sentence
        example: "2027-02-28"
      - name: renewal_premium
        type: money
        description: Premium quoted for the coming period of insurance, in SGD
        example: "781.00"
      - name: payment_due_date
        type: date
        description: Date the notice asks payment by, printed as Please pay by
        example: "2027-02-14"

  claim_letter:
    description: Letter from an insurer about a claim, including settlement advice
    subject_field: claimant
    fields:
      - name: insurer
        type: string
        description: Name of the insurance company, from the letterhead
        example: Meridian Assurance
      - name: policy_no
        type: identifier
        description: Policy the claim was made against, exactly as printed
        example: HL-2024-771903
      - name: claim_no
        type: identifier
        description: Claim reference exactly as printed in the reference line
        example: CLM-2026-0033812
      - name: claimant
        type: person
        description: Name of the person the claim relates to, as addressed
        example: Mdm Fernandez
      - name: incident_date
        type: date
        required: false
        description: Date of the event being claimed for, where the letter states one
        example: "2026-03-14"
      - name: settled_amount
        type: money
        required: false
        description: Amount paid out in SGD, where the letter states a settlement
        example: "4820.50"

  benefit_illustration:
    description: Illustration of benefits and values issued with a life or health policy
    subject_field: life_assured
    fields:
      - name: insurer
        type: string
        description: Name of the insurance company, from the illustration header
        example: Kallang Life
      - name: policy_no
        type: identifier
        required: false
        description: Policy number if the illustration carries one, exactly as printed
        example: LF-2023-118844
      - name: life_assured
        type: person
        description: Name of the person covered, as printed on the illustration
        example: Marcus Fernandez
      - name: sum_assured
        type: money
        description: Headline sum assured as printed, never a projected value, in SGD
        example: "250000.00"
      - name: annual_premium
        type: money
        description: Premium payable each year as printed, in SGD
        example: "3180.00"

  policy_anniversary_statement:
    description: Annual statement issued on the anniversary of a life or investment-linked policy
    subject_field: life_assured
    fields:
      - name: insurer
        type: string
        description: Name of the insurance company, from the statement letterhead
        example: Kallang Life
      - name: policy_no
        type: identifier
        description: Policy number exactly as printed, not normalised
        example: LF-2023-118844
      - name: life_assured
        type: person
        description: Name of the person covered, as printed on the statement
        example: Marcus Fernandez
      - name: statement_date
        type: date
        description: Date the annual statement is stated to be for, as printed on the statement
        example: "2026-06-01"
      - name: sum_assured
        type: money
        description: Sum assured as at the statement date, in SGD
        example: "250000.00"
      - name: annual_premium
        type: money
        description: Premium payable each year as printed on the statement, in SGD
        example: "3180.00"
      - name: surrender_value
        type: money
        required: false
        description: Cash or surrender value as at the statement date, in SGD
        example: "18740.25"
      - name: premiums_paid_to_date
        type: money
        required: false
        description: Total premiums paid since inception where the statement prints it, in SGD
        example: "9540.00"

  payslip:
    description: Monthly salary advice issued by an employer
    subject_field: employee
    fields:
      - name: employee
        type: person
        description: Name of the employee as printed on the payslip
        example: Marcus Fernandez
      - name: employer
        type: string
        description: Legal name of the employing company as printed
        example: Harborline Logistics Pte Ltd
      - name: pay_period
        type: month
        description: The month the payslip covers, as YYYY-MM
        example: "2026-01"
      - name: gross_salary
        type: money
        description: Total pay before any deduction, in SGD
        example: "8900.00"
      - name: cpf_employee
        type: money
        required: false
        description: Employee CPF contribution deducted this period, in SGD
        example: "1780.00"
      - name: net_pay
        type: money
        description: Amount actually paid to the employee, in SGD
        example: "7120.00"

  donation_receipt:
    description: Official receipt from a charity for a donation
    subject_field: donor
    fields:
      - name: donor
        type: person
        description: Name of the person who made the donation
        example: Marcus Fernandez
      - name: charity
        type: string
        description: Name of the receiving organisation as printed
        example: Riverbend Community Fund
      - name: receipt_no
        type: identifier
        description: The receipt reference exactly as printed, not normalised
        example: R84120933
      - name: donation_date
        type: date
        description: Date the donation was received
        example: "2026-03-14"
      - name: donation_amount
        type: money
        description: Amount donated as printed on the receipt, in SGD
        example: "500.00"
      - name: tax_deductible
        type: boolean
        required: false
        description: Whether the receipt states the donation is tax deductible
        example: "true"

  cpf_statement:
    description: Annual or periodic CPF contribution statement
    subject_field: member
    fields:
      - name: member
        type: person
        description: Name of the CPF member the statement belongs to
        example: Marcus Fernandez
      - name: statement_year
        type: integer
        description: The calendar year the statement covers
        example: "2025"
      - name: total_contributions
        type: money
        description: Total credited for the statement year, employee and employer combined, in SGD
        example: "21360.00"
      - name: ordinary_account_balance
        type: money
        required: false
        description: Ordinary Account balance at the statement date, in SGD
        example: "104220.15"

  srs_statement:
    description: Supplementary Retirement Scheme account statement
    subject_field: account_holder
    fields:
      - name: account_holder
        type: person
        description: Name of the SRS account holder
        example: Priya Nair
      - name: account_no
        type: identifier
        description: SRS account reference exactly as printed
        example: SRS-4471-2208
      - name: statement_year
        type: integer
        description: The calendar year the statement covers
        example: "2026"
      - name: contributions_ytd
        type: money
        description: Contributions made so far this year, in SGD
        example: "12400.00"

  # The tax reference printed here is the taxpayer's NRIC or FIN. It is not a field on this
  # type: identity numbers are captured from identity documents (ADR 0017 decision 6).
  notice_of_assessment:
    description: Notice of Assessment issued by IRAS stating assessed income and tax payable
    subject_field: taxpayer
    fields:
      - name: taxpayer
        type: person
        description: Name of the taxpayer as printed on the notice
        example: Marcus Fernandez
      - name: assessment_year
        type: integer
        description: Year of Assessment printed at the head of the notice
        example: "2026"
      - name: assessable_income
        type: money
        description: Assessable income for the year as stated on the notice, in SGD
        example: "104500.00"
      - name: tax_payable
        type: money
        description: Total tax payable as stated on the notice, in SGD
        example: "7318.20"
      - name: payment_due_date
        type: date
        description: Date the notice requires payment by, as printed
        example: "2026-06-30"

  # CPF cash top-up relief is claimed by whoever makes the top-up, so the subject is the member
  # who paid, not the account topped up. Both are printed on the acknowledgement.
  cpf_topup_receipt:
    description: CPF acknowledgement of a cash top-up to a member's Special, Retirement or MediSave Account under the Retirement Sum Topping-Up scheme
    subject_field: member
    fields:
      - name: member
        type: person
        description: Name of the person who made the top-up, printed as the giver or payer
        example: Marcus Fernandez
      - name: recipient
        type: person
        description: Name of the CPF member whose account received the top-up, as printed
        example: Rosa Fernandez
      - name: topup_date
        type: date
        description: Date the top-up was received by CPF Board, as printed on the acknowledgement
        example: "2026-11-20"
      - name: topup_amount
        type: money
        description: Amount of cash topped up as printed on the acknowledgement, in SGD
        example: "8000.00"
      - name: account_topped_up
        type: enum
        values: [SA, RA, MA]
        description: Account that received the top-up, printed as Special, Retirement or MediSave Account
        example: RA

  # Course Fees Relief lapses from YA2026, so this type grounds YA2025 answers only; kept because
  # a household still holds these receipts and asks about them.
  course_fee_receipt:
    description: Receipt from a training provider for fees paid for a course, seminar or examination
    subject_field: student
    fields:
      - name: student
        type: person
        description: Name of the person who attended the course, as printed on the receipt
        example: Priya Nair
      - name: provider
        type: string
        description: Name of the training provider or institution from the letterhead
        example: Northshore Institute of Management
      - name: receipt_no
        type: identifier
        description: The receipt reference exactly as printed, not normalised
        example: NIM-R-2025-00418
      - name: payment_date
        type: date
        description: Date the fee was paid, as printed on the receipt
        example: "2025-04-07"
      - name: course_title
        type: string
        description: Title of the course or examination as printed on the receipt
        example: Graduate Diploma in Financial Management
      - name: fee_amount
        type: money
        description: Total course or examination fee paid as printed, in SGD
        example: "4200.00"

  # Identity documents are household data (ADR 0017 decision 6): stored on-device, behind the
  # app lock, and recorded in docs/governance/data-inventory.md. The back of an identity card
  # prints none of these fields and quarantines; there is deliberately no type for it.
  identity_card:
    description: Front of a national identity card (NRIC or FIN card) printing an identity number, full name and date of birth. Not the card back, which prints only an address, date of issue and postcode
    subject_field: full_name
    fields:
      - name: id_number
        type: identifier
        description: Identity card number exactly as printed, not normalised
        example: S8714289B
      - name: full_name
        type: person
        description: Full name of the card holder as printed on the card
        example: MARCUS LIM JUN WEI
      - name: date_of_birth
        type: date
        description: Date of birth of the card holder as printed on the card
        example: "1987-05-08"

  passport:
    description: Passport data page printing a passport number, the holder's name, date of birth and date of expiry
    subject_field: full_name
    fields:
      - name: passport_no
        type: identifier
        description: Passport number exactly as printed on the data page
        example: K8923156Q
      - name: full_name
        type: person
        description: Full name of the passport holder as printed on the data page
        example: RACHEL NG HUI SHAN
      - name: date_of_birth
        type: date
        description: Date of birth of the passport holder as printed on the data page
        example: "1989-02-17"
      # Not `expiry_date`: the policy_expiry reminder reads that name.
      - name: date_of_expiry
        type: date
        description: Date the passport expires, as printed on the data page
        example: "2033-02-28"

  birth_certificate:
    description: Birth certificate issued on registering a child's birth, printing a registration number, the child's name and date of birth
    subject_field: child_name
    fields:
      - name: registration_no
        type: identifier
        description: Birth registration or certificate number exactly as printed
        example: T1942088J
      - name: child_name
        type: person
        description: Name of the child whose birth is registered, as printed
        example: LUCAS LIM KAI EN
      - name: date_of_birth
        type: date
        description: Child's date of birth as printed on the certificate
        example: "2019-06-14"

  loan_agreement:
    description: Housing loan facility letter or hire purchase agreement from a bank or finance company, setting out the amount lent and the repayments
    subject_field: borrower
    fields:
      - name: lender
        type: string
        description: Name of the bank or finance company lending, from the letterhead
        example: Crescent Bank
      - name: facility_no
        type: identifier
        description: Loan reference or agreement number exactly as printed
        example: HL-2021-994182
      - name: borrower
        type: person
        description: Name of the borrower or hirer as printed; the first named where there are two
        example: Marcus Lim Jun Wei
      - name: principal
        type: money
        description: Approved facility amount or principal amount financed, in SGD
        example: "540000.00"
      - name: monthly_repayment
        type: money
        required: false
        description: Monthly repayment, instalment or installment amount as printed, often followed by per month, in SGD
        example: "2234.50"
      - name: agreement_date
        type: date
        required: false
        description: Date of the letter or agreement as printed
        example: "2021-03-15"

registers:
  reminder:
    - key: policy_expiry
      from_field: expiry_date
      lead_days: [60, 30, 14, 1]
    # Many countries refuse entry on a passport with under six months left, so the first nudge is early.
    - key: passport_expiry
      from_field: date_of_expiry
      lead_days: [180, 90, 30]
    # Both dates are fixed to a single year. ReminderConfig offers only `from_field` or
    # `on_date` — there is no recurring option — so each will fall silent once its date
    # passes. Making them recur is a core/contracts.py change, which is its own PR.
    - key: filing_deadline
      on_date: 2027-04-18
      lead_days: [30, 7, 1]
    - key: srs_contribution_cutoff
      on_date: 2026-12-31
      lead_days: [30]
  alert:
    - metric: days_uncovered
      ceiling: 0
      warn_at: 1.0
    - metric: srs_contributions_ytd
      ceiling: 15300
      warn_at: 0.9
  tracker:
    metrics: [donations_ytd, cpf_contributions_ytd, srs_contributions_ytd]

# The everyday layer: applies to every question, whichever packs are enabled. A pack's own
# answering adds its vocabulary, categories and exclusions on top.
answering:
  max_sentences: 6
