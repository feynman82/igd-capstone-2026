<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Outfit:wght@500;600;700&amp;display=swap">
  <style>
    .t-light {
      --ground: #f7f2e9; --surface: #fffcf6; --surface-2: #f1e9db; --surface-3: #e9dfcd;
      --ink: #2b2621; --ink-2: #554c41; --ink-3: #6e6354;
      --hairline: #e3d9c8;
    }
    body { margin: 0; background: #f7f2e9; }
    a { color: #8e3620; }
    a:hover { color: #b4462a; }
    .page { font-family: Figtree, "Segoe UI", system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; letter-spacing: -0.005em; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
    .display { font-family: Outfit, "Segoe UI", system-ui, sans-serif; letter-spacing: -0.02em; }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; letter-spacing: -0.01em; }
  </style>
</helmet>
<div class="page t-light" style="min-height: 900px; box-sizing: border-box; background: var(--ground); color: var(--ink); display: flex; justify-content: center; padding: 200px 24px 64px;">
  <div style="width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 24px;">

    <svg viewBox="0 0 32 32" width="40" height="40"><rect width="32" height="32" rx="8.8" style="fill: var(--surface-3);"></rect><path d="M11 24V9.5A1.5 1.5 0 0 1 12.5 8h5.8a5.6 5.6 0 0 1 0 11.2H14" style="fill: none; stroke: var(--ink-3); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;"></path></svg>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 class="display" style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 600;">Parrot is off</h1>
      <p style="margin: 0; font-size: 17.5px; line-height: 1.3; color: var(--ink-2); text-wrap: pretty;">The assistant, its filing and these screens have stopped. Your documents are kept, and everything Parrot has already read is still there when it starts again.</p>
    </div>

    <p style="margin: 0; font-size: 15.5px; line-height: 1.55; color: var(--ink-2);">To start it again, open <span class="mono" style="color: var(--ink);">START.cmd</span> in the Parrot folder.</p>

    <p style="margin: 0; font-size: 13px; color: var(--ink-3);">You can close this tab.</p>

  </div>
</div>
</x-dc>
</body>
</html>
