name: parrot
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: parrot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parrot}
      POSTGRES_DB: parrot
    ports: ["127.0.0.1:${PARROT_DB_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parrot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${PARROT_REDIS_PORT:-6379}:6379"]

  # Ollama runs on the host, using one endpoint by default.
  # The external RTX 3080 is development-only. Demo runs use the onboard RTX 4060.
  # Verify device identity before selecting a GPU; enumeration order is not stable.

volumes:
  pgdata:
