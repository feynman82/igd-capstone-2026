# Copy this directory, rename it to your pack id, and fill it in.
# Then run:  python -m packs.build
#
# This YAML is the SINGLE SOURCE OF TRUTH. It generates the Pydantic extraction models and
# the register column headers the corpus is filled in against. Never edit a generated file.

id: example_pack
version: 0.1.0
display_name: Example Domain

document_types:

  example_document:
    description: One sentence saying what this kind of document is
    subject_field: holder          # which field says whose document this is (optional)
    fields:
      - name: issuer
        type: string
        description: Who produced this document, as printed on it
        example: Meridian Assurance
      - name: reference_no
        type: identifier           # copied exactly, never normalised
        description: The document reference exactly as printed
        example: EX-2026-000123
      - name: holder
        type: person
        description: Name of the person this document is about
        example: Marcus Fernandez
      - name: effective_date
        type: date
        description: The date this document takes effect
        example: "2026-03-01"
      - name: amount
        type: money
        required: false
        description: The headline amount on the document, in SGD
        example: "742.00"

grounding:
  corpus: null                     # null = answer only from the user's own documents
  top_k: 6

registers:
  reminder:
    - key: example_expiry
      from_field: effective_date
      lead_days: [60, 30, 7]
  # alert:   [{ metric: example_total, ceiling: 1000, warn_at: 0.9 }]
  # tracker: { metrics: [example_total] }

persona:
  system: >
    You explain what the user's own documents say about this domain.
    You never compare against products or rules you recall but cannot cite.

guardrails:
  must_cite: true
  abstain_below: 0.42
  never_acts: true
  disclaimer: >
    Informational analysis of your own documents. Not professional advice.
