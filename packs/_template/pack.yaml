# Copy this directory, rename it to your pack id, and fill it in.
# Then run:  python -m packs.build
#
# A pack is grounding, a persona, its own answering and advice (ADR 0017). It declares no
# document types and no registers: those live in core/documents.yaml, and every field this pack
# names must be declared there. Never edit a generated file.

id: example_pack
version: 0.2.0
display_name: Example Domain

grounding:
  corpus: null                     # null = answer only from the user's own documents
  top_k: 6
  # values:                        # rule keys your sources publish; never the numbers. §6c
  #   - key: example_cap
  #     unit: money
  #     description: The published yearly cap on this kind of amount

persona:
  system: >
    You explain what the user's own documents say about this domain.
    You never compare against products or rules you recall but cannot cite.

guardrails:
  must_cite: true
  abstain_below: 0.42
  never_acts: true
  disclaimer: >
    Informational analysis of your own documents. Not professional advice.

# Optional. How people ask about this domain. See packs/README.md §6b.
# answering:
#   documents: [payslip]          # core types whose answers this pack's guardrails govern
#   max_sentences: 6
#   vocabulary:
#     everyday word: what the document prints
#   categories:
#     match_field: a_string_field_in_core_documents_yaml
#     noun: documents
#     rules:
#       - id: first_kind
#         label: first kind of document
#         printed: [words printed in its name]
#         asked: [words a person uses when asking about it]

# Optional. Advice: code calculates, the model explains, the owner consents once.
# See packs/README.md §6c. Without this block the pack declines to recommend.
# advice:
#   consent_version: 1.0.0
#   consent_text: >
#     I agree that the assistant may calculate advice from my household's documents and the
#     published guidance this pack holds.
#   disclaimer: >
#     A calculation from your own documents and published guidance. Not professional advice.
#   product_disclosure: >
#     Where a product is named, only what both documents print is compared.
#   shapes:
#     - id: example_room
#       calculator: remaining_room     # closed list: see packs/README.md §6c
#       label: room left under the cap
#       asked: [how much more can i, room left]
#       facts:
#         - role: used
#           doc_types: [srs_statement]     # types declared in core/documents.yaml
#           field: contributions_ytd
#           take: latest
#           missing: The documents showing what has been used so far this year.
#       rules:
#         - role: cap
#           key: example_cap           # a key under grounding.values, never a number
#           missing: Reviewed guidance stating the yearly cap.
