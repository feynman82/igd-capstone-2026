# Copy this directory, rename it, fill it in. Validate with:
#   uv run python -c "from core.contracts import PackManifest; import yaml,sys; \
#     PackManifest.model_validate(yaml.safe_load(open('packs/<id>/pack.yaml'))); print('ok')"
id: example_pack
version: 0.1.0
display_name: Example Domain
owns_document_types: [example_document]

extraction:
  model: packs.example_pack.schemas:ExampleDocument
  writes: [facts, obligations]

grounding:
  corpus: null          # null = answer only from the user's own documents
  top_k: 6

registers:
  reminder:
    obligations:
      - key: example_expiry
        from_field: expiry_date
        lead_days: [60, 30, 7]
  # alert:   { thresholds: [{ metric: example_total, ceiling: 1000, warn_at: 0.9 }] }
  # tracker: { metrics: [example_total] }

persona:
  system: >
    You explain what the user's own documents say about this domain.
    You never compare against products or rules you recall but cannot cite.

guardrails:
  must_cite: true
  abstain_below: 0.42
  never_acts: true
  disclaimer: >
    Informational analysis of your own documents. Not professional advice.
