# Insurance and Coverage — domain pack
#
# A pack is grounding + persona + specialised answering + advice (ADR 0017). It declares no
# document types and no registers: those live in core/documents.yaml, and the fields this pack
# names are checked against that catalogue when packs load. After editing, run:
#     python -m packs.build
# Never edit a generated file by hand.

id: insurance_agent
version: 0.6.0
display_name: Insurance and Coverage

# Public Singapore protection and health insurance guidance, with provenance per source. The
# values are keys only: the numbers are extracted from the sources and approved by a person with
# scripts/review_grounding_values.py before any calculator reads them (ADR 0016).
grounding:
  corpus: sg_protection_guidance
  top_k: 6
  values:
    - key: death_tpd_income_multiple
      unit: multiple
      description: Multiple of annual income recommended as death and total permanent disability cover
    - key: ci_income_multiple
      unit: multiple
      description: Multiple of annual income recommended as critical illness cover
    - key: medishield_life_premium
      unit: money
      qualifiers: [age_band]
      description: MediShield Life annual premium, including GST, by age next birthday
    - key: dps_sum_assured
      unit: money
      qualifiers: [age_band]
      description: Dependants' Protection Scheme sum assured by age band

persona:
  system: >
    You are the household's insurance specialist. You explain its policies plainly and briefly,
    naming the policy and the clause each point comes from, and when a calculation has been done
    you explain it without changing its figures or its verdict.

guardrails:
  must_cite: true
  abstain_below: 0.45
  never_acts: true
  verdict_by_code: true
  disclaimer: >
    Based on your own insurance documents and published Singapore guidance. Parrot is not a
    financial adviser licensed by MAS under the Financial Advisers Act; confirm cover, exclusions
    and renewal terms with your insurer or a licensed financial adviser before you act.
  advice_decline: >
    I can explain what your policies say. For Parrot to calculate a recommendation on your cover,
    turn on insurance advice in Household settings, or speak with a licensed financial adviser.

# Advice (ADR 0016). Code calculates every figure and chooses the verdict from the household's own
# cited facts and published values a person approved; the model only explains. Consent is the
# owner's and covers adult household members.
advice:
  consent_version: 1.0.0
  consent_text: >
    I ask Parrot to calculate personalised insurance guidance for my household from our own
    documents and from published Singapore guidance (MoneySense, MAS, MOH, CPF Board and LIA). I
    understand that Parrot is not a MAS-licensed financial adviser and does not replace one, that
    its figures are only as complete as the documents on file, and that I should confirm any
    decision with a licensed adviser.
  disclaimer: >
    A calculation from your household's documents and published guidance, not a recommendation
    from a MAS-licensed financial adviser. Figures cover only the policies on file; group or
    employer cover that was never filed is not counted.
  product_disclosure: >
    Where a product is named, it is named because a document on file prints it. Parrot is not
    paid by any insurer and does not sell or arrange insurance.
  shapes:
    - id: death_tpd_cover
      calculator: gap
      label: death and total permanent disability cover
      asked:
        - enough life insurance
        - enough life cover
        - enough death cover
        - death and tpd
        - life cover gap
        - life cover enough
        - life insurance enough
      facts:
        - role: income
          doc_types: [payslip]
          field: gross_salary
          per: month
          missing: A recent payslip, so your annual income is known.
        - role: held
          doc_types: [policy_schedule]
          field: sum_insured
          category: whole_life
          take: sum
          missing: The schedule of each life policy you hold.
        - role: held
          doc_types: [policy_schedule]
          field: sum_insured
          category: term_life
          take: sum
          missing: The schedule of each life policy you hold.
      rules:
        - role: multiple
          key: death_tpd_income_multiple
          missing: Reviewed guidance on how much death and TPD cover to hold.
      # Named by code when this gap is short. A kind of cover, never an insurer's product.
      closed_by: [term_life, whole_life]
      never_say: [you must buy, guaranteed]
    - id: ci_cover
      calculator: gap
      label: critical illness cover
      asked:
        - enough critical illness
        - critical illness gap
        - enough ci cover
        - critical illness cover enough
        - critical illness insurance enough
      facts:
        - role: income
          doc_types: [payslip]
          field: gross_salary
          per: month
          missing: A recent payslip, so your annual income is known.
        - role: held
          doc_types: [policy_schedule]
          field: sum_insured
          category: critical_illness
          take: sum
          missing: The schedule of each critical illness plan or rider you hold.
        - role: held
          doc_types: [policy_schedule]
          field: riders
          category: critical_illness
          take: sum
          missing: The schedule of each critical illness plan or rider you hold.
      rules:
        - role: multiple
          key: ci_income_multiple
          missing: Reviewed guidance on how much critical illness cover to hold.
      closed_by: [critical_illness]
      never_say: [you must buy, guaranteed]

  # One question, every check (ADR 0016 addendum): each shape's shortfall or met guideline, each
  # missing fact, and each kind of cover below that nothing on file is.
  review:
    label: insurance coverage review
    asked:
      - lacking in my insurance
      - lacking in my coverage
      - missing in my insurance
      - gaps in my insurance
      - gap in my insurance
      - review my insurance
      - review my coverage
      - coverage review
      - am i underinsured
      - enough insurance
      # Asking what to get is asking what is missing. The router already reads these as
      # `advise`; without a phrase here the shape match failed and the question was declined.
      - what should i get
      - what should i buy
      - what do i need
      - what insurance do i need
      - recommend insurance
      - recommend a policy
      - recommend policies
      - recommend the type of policies
      - what policies should i
      - what cover should i
      - types of policies i should
      - should i get more
      # Optimising cover is reviewing it: the router reads these as `advise`, and on 2 October
      # every one was declined because no phrase matched. Both spellings; each names insurance,
      # so "optimise my tax reliefs" stays the tax pack's.
      - optimise my coverage
      - optimize my coverage
      - optimise my personal coverage
      - optimize my personal coverage
      - optimise my cover
      - optimize my cover
      - optimise my insurance
      - optimize my insurance
      - optimise my protection
      - optimize my protection
      - improve my coverage
      - improve my insurance
    shapes: [death_tpd_cover, ci_cover]
    holds: [hospital_expense, long_term_care]
    # The order a MAS-licensed adviser works through a needs analysis, quoted from the corpus:
    # what is collected, how it is analysed, the basis given, the check on existing cover, and
    # the review after. The explanation follows it and cites it; a quote its source stops
    # printing is not cited.
    explained_by:
      - file: moneysense-financial-advisory-process.md
        quote: >-
          Your FA representative will gather information about your financial situation, goals,
          and needs. This fact-finding process is called an FNA - it is the foundation for any
          recommendation they make.
      - file: mas-faa-n16-recommendations.md
        quote: >-
          for any recommendation made in respect of life policies, the number of dependants of the
          client and the extent and duration of financial support required for each of the
          dependants.
      - file: mas-faa-n16-recommendations.md
        quote: >-
          Section 36 of the Act requires a financial adviser to analyse the information provided by
          the client and identify the product that is suitable for the client based on the
          information obtained from the client.
      - file: moneysense-financial-advisory-process.md
        quote: Your FA representative must have a clear and reasonable basis for any recommendation.
      - file: moneysense-what-to-ask-life-insurance.md
        quote: >-
          Does it supplement or complement the financial products (insurance and investment
          products) you already have? Will you be over-insured or exposed to more investment risks?
      - file: moneysense-financial-advisory-process.md
        quote: >-
          A good FA representative will check in with you from time to time to review your policy or
          investment portfolio and see whether it continues to meet your needs.

# How people ask about insurance, applied by the core without a model. Nothing here is a field:
# a category is a reading of the printed product name that a person reviewed, and it is never
# stored. Order matters — the first rule whose printed words appear wins.
answering:
  # The core document types this pack speaks for: its guardrails and persona govern them.
  documents:
    - policy_schedule
    - renewal_notice
    - claim_letter
    - benefit_illustration
    - policy_anniversary_statement
  max_sentences: 6
  vocabulary:
    kena warded: was hospitalised as an inpatient
    warded: hospitalised as an inpatient
    claimable: can claim
    a&e: emergency department
    maid: domestic helper
  categories:
    match_field: product_name
    noun: policies
    rules:
      - id: hospital_cash
        label: hospital cash or income plan
        printed: [hospital income, hospital cash, daily cash]
        asked: [hospital cash, hospital income, warded, hospitalised, hospitalized, hospital]
      - id: critical_illness
        label: critical illness plan
        printed: [critical illness, early critical, multi-stage critical]
        asked: [critical illness, ci plan, cancer, heart attack, stroke]
      - id: long_term_care
        label: long-term care plan
        printed: [careshield life, eldershield, long-term care, long term care]
        asked: [long-term care, long term care, severe disability, careshield life, eldershield]
      - id: hospital_expense
        label: hospital and surgical plan
        printed:
          - integrated shield
          - hospital and surgical
          - hospital & surgical
          - healthshield
          - medishield
        asked:
          - warded
          - hospitalised
          - hospitalized
          - hospitalisation
          - hospitalization
          - hospital
          - surgery
          - operation
          - inpatient
      - id: personal_accident
        label: personal accident plan
        printed: [personal accident]
        asked: [personal accident, accident, injury, fracture]
      - id: whole_life
        label: whole life plan
        printed: [whole life]
        asked: [life insurance, life policy, life cover, whole life, death benefit]
      - id: term_life
        label: term life plan
        printed: [term life, term plan, term assurance]
        asked: [life insurance, life policy, life cover, term life, death benefit]
      - id: investment_linked
        label: investment-linked plan
        printed: [investment-linked, investment linked]
        asked: [investment-linked, investment linked, ilp]
      - id: motor
        label: car or motor policy
        printed: [private car, motor, motorcycle]
        asked: [car, motor, vehicle, motorcycle]
      - id: home
        label: home or contents policy
        printed: [home, contents, householder, fire insurance]
        asked: [home, house, flat, contents, burglary, water damage]
      - id: travel
        label: travel policy
        printed: [travel]
        asked: [travel, trip, overseas, flight]
      - id: domestic_helper
        label: domestic helper policy
        printed: [maid, domestic helper, domestic worker, foreign domestic]
        asked: [maid, helper, domestic helper, domestic worker, fdw]
      - id: pet
        label: pet policy
        printed: [pet]
        asked: [pet, dog, cat]
      - id: dental
        label: dental plan
        printed: [dental]
        asked: [dental, dentist, teeth, tooth, braces]
  exclusions:
    headings: [exclusions, what is not covered, not covered]
    claims: [covers, covered, cover, pays, payable, reimburses, can claim, claimable]
    negations: [not, "no", excluded, except, exclusion, unless, never]
