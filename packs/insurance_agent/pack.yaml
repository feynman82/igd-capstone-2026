# Insurance and Coverage — domain pack
#
# This file is the SINGLE SOURCE OF TRUTH. After editing, run:
#     python -m packs.build
# which regenerates schemas.py and the register column headers Desmond fills in.
# Never edit a generated file by hand.

id: insurance_agent
version: 0.2.0
display_name: Insurance and Coverage

document_types:

  policy_schedule:
    description: Policy schedule or certificate of insurance setting out cover and premium
    subject_field: insured
    fields:
      - name: insurer
        type: string
        description: Name of the insurance company as printed on the schedule letterhead
        example: Meridian Assurance
      - name: policy_no
        type: identifier
        description: Policy number exactly as printed, not normalised
        example: MV-2026-448120
      - name: insured
        type: person
        description: Name of the policyholder as printed against Name of Insured
        example: Marcus Fernandez
      - name: product_name
        type: string
        description: Product name as printed at the head of the schedule, not a category
        example: Private Car Insurance Policy
      - name: cover_from
        type: date
        description: First day of the period of insurance, the from date on that line
        example: "2026-03-01"
      - name: expiry_date
        type: date
        description: Last day of the period of insurance, the to date on that line
        example: "2027-02-28"
      - name: premium_payable
        type: money
        description: Total premium payable for the period of insurance shown, in SGD
        example: "742.00"
      - name: sum_insured
        type: money
        required: false
        description: Sum insured or limit of liability where the schedule prints one, in SGD
        example: "250000.00"
      - name: excess
        type: money
        required: false
        description: Amount the policyholder bears per claim, printed as Excess, in SGD
        example: "750.00"

  renewal_notice:
    description: Notice issued before expiry inviting the policyholder to renew
    subject_field: insured
    fields:
      - name: insurer
        type: string
        description: Name of the insurance company issuing the notice, from the letterhead
        example: Meridian Assurance
      - name: policy_no
        type: identifier
        description: Policy number exactly as printed, not normalised
        example: MV-2026-448120
      - name: insured
        type: person
        description: Name of the policyholder the notice is addressed to
        example: Marcus Fernandez
      - name: expiry_date
        type: date
        description: Date the current cover ends, as printed in the expiry sentence
        example: "2027-02-28"
      - name: renewal_premium
        type: money
        description: Premium quoted for the coming period of insurance, in SGD
        example: "781.00"
      - name: payment_due_date
        type: date
        description: Date the notice asks payment by, printed as Please pay by
        example: "2027-02-14"

  claim_letter:
    description: Letter from an insurer about a claim, including settlement advice
    subject_field: claimant
    fields:
      - name: insurer
        type: string
        description: Name of the insurance company, from the letterhead
        example: Meridian Assurance
      - name: policy_no
        type: identifier
        description: Policy the claim was made against, exactly as printed
        example: HL-2024-771903
      - name: claim_no
        type: identifier
        description: Claim reference exactly as printed in the reference line
        example: CLM-2026-0033812
      - name: claimant
        type: person
        description: Name of the person the claim relates to, as addressed
        example: Mdm Fernandez
      - name: incident_date
        type: date
        required: false
        description: Date of the event being claimed for, where the letter states one
        example: "2026-03-14"
      - name: settled_amount
        type: money
        required: false
        description: Amount paid out in SGD, where the letter states a settlement
        example: "4820.50"

  benefit_illustration:
    description: Illustration of benefits and values issued with a life or health policy
    subject_field: life_assured
    fields:
      - name: insurer
        type: string
        description: Name of the insurance company, from the illustration header
        example: Kallang Life
      - name: policy_no
        type: identifier
        required: false
        description: Policy number if the illustration carries one, exactly as printed
        example: LF-2023-118844
      - name: life_assured
        type: person
        description: Name of the person covered, as printed on the illustration
        example: Marcus Fernandez
      - name: sum_assured
        type: money
        description: Headline sum assured as printed, never a projected value, in SGD
        example: "250000.00"
      - name: annual_premium
        type: money
        description: Premium payable each year as printed, in SGD
        example: "3180.00"

  policy_anniversary_statement:
    description: Annual statement issued on the anniversary of a life or investment-linked policy
    subject_field: life_assured
    fields:
      - name: insurer
        type: string
        description: Name of the insurance company, from the statement letterhead
        example: Kallang Life
      - name: policy_no
        type: identifier
        description: Policy number exactly as printed, not normalised
        example: LF-2023-118844
      - name: life_assured
        type: person
        description: Name of the person covered, as printed on the statement
        example: Marcus Fernandez
      - name: sum_assured
        type: money
        description: Sum assured as at the statement date, in SGD
        example: "250000.00"
      - name: annual_premium
        type: money
        description: Premium payable each year as printed on the statement, in SGD
        example: "3180.00"
      - name: surrender_value
        type: money
        required: false
        description: Cash or surrender value as at the statement date, in SGD
        example: "18740.25"
      - name: premiums_paid_to_date
        type: money
        required: false
        description: Total premiums paid since inception where the statement prints it, in SGD
        example: "9540.00"

# No grounding corpus. This pack answers only from the user's own policy documents.
# grounding/mas_fair_dealing/ is retained as a placeholder: its sources.yaml is empty, and
# the MAS Fair Dealing Guidelines are a conduct standard for insurers rather than material
# that answers what a household is covered for. Reopen with real sources and retrieval
# dates recorded, reviewed by Siew, before setting a corpus here.
grounding:
  corpus: null
  top_k: 0

registers:
  reminder:
    - key: policy_expiry
      from_field: expiry_date
      lead_days: [60, 30, 14, 1]
  alert:
    - metric: days_uncovered
      ceiling: 0
      warn_at: 1.0

persona:
  system: >
    You explain what the user's own insurance documents say: what is covered, what is
    excluded, what it costs and when it ends. You answer only from the documents in front
    of you, and you decline to compare products, recommend cover, or state a policy term
    you cannot point at on a page.

guardrails:
  must_cite: true
  abstain_below: 0.45
  never_acts: true
  disclaimer: >
    Informational analysis of your own policy documents only. This is not financial advice
    under the Financial Advisers Act, and it does not recommend or compare insurance
    products. Confirm cover, exclusions and renewal terms with your insurer or a licensed
    financial adviser before you act.
