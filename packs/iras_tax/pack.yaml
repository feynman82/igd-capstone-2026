# Tax and Reliefs (Singapore) — domain pack
#
# A pack is grounding, a persona, its own answering and advice (ADR 0017). It declares no
# document types and no registers: those live in core/documents.yaml, and the fields this pack
# names are checked against that catalogue when packs load. After editing, run:
#     python -m packs.build
# Never edit a generated file by hand.

id: iras_tax
version: 0.3.0
display_name: Tax and Reliefs

# The corpus has no documents yet (packs/iras_tax/grounding/iras_reliefs_ya2026/sources.yaml),
# so nothing is cited from it until one is recorded and reviewed.
grounding:
  corpus: iras_reliefs_ya2026
  top_k: 8

persona:
  system: >
    You explain what the user's own tax documents say, and how published IRAS guidance
    applies to the figures in them. You never state a relief amount or eligibility rule
    that is not in the grounding corpus, and you never estimate a tax liability.

guardrails:
  must_cite: true
  abstain_below: 0.42
  never_acts: true
  disclaimer: >
    Informational analysis of your own documents and published IRAS guidance.
    This is not tax advice. Verify against IRAS before filing.
