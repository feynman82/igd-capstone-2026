[project]
name = "parrot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118", "uvicorn[standard]>=0.32", "celery>=5.4", "redis>=5.2",
  "pydantic>=2.9", "pyyaml>=6.0", "sqlalchemy>=2.0", "psycopg[binary]>=3.2",
  "pgvector>=0.3", "langgraph>=0.2", "langgraph-checkpoint-postgres>=2.0",
  "docling>=2.0", "httpx>=0.27", "apscheduler>=3.10", "pypdfium2>=4.30",
]

[project.optional-dependencies]
eval  = ["ragas>=0.2", "datasets>=3.0", "pandas>=2.2"]
dev   = ["ruff>=0.7", "mypy>=1.13", "pytest>=8.3", "pytest-asyncio>=0.24", "types-PyYAML"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Generated by `python -m packs.build` from pack.yaml: a field description is one string, and
# wrapping it would change the file the build check compares against.
"packs/*/schemas.py" = ["E501"]
# Corpus-generation notebooks: synthetic document text and HTML fragments are long literal
# strings, not product code. Imports and unused names are still checked.
"notebooks/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# The repository is a set of top-level packages, not an installed distribution.
pythonpath = ["."]
